name: Lint en build simulator

on:
  push:
    branches: ["main"]

jobs:
  lint-js:
    name: Lint simulator (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint

  build-and-push:
    name: Build & push image naar GHCR
    needs: lint-js
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Bepaal image-naam in kleine letters
        id: image-name
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login bij GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bouw en push simulator-image
        uses: docker/build-push-action@v6
        with:
          context: ./simulator
          push: true
          tags: ghcr.io/${{ steps.image-name.outputs.name }}/sensor-gateway-simulator:latest
